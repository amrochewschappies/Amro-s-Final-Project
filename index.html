<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Amro Ahmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styling.css" />
  <link rel="stylesheet" href="./CSS/navigationBarStyling.css" />
  <link rel="stylesheet" href="./CSS/homePageStyling.css" />

  <script type="module">
    import { loadNavbar } from "./Javascript/navigationBar.js";
    loadNavbar("Home");
  </script>

  <!-- If these files do NOT use import/export, keep them as plain scripts -->
  <script type="module" src="./Javascript/audioController.js" defer></script>
</head>


<body>
  <header id="header">
    <nav id="nav-bar"></nav>
  </header>
  <canvas class="webgl"> </canvas>

  <div id="loader" class="loader speedo">
    <svg viewBox="0 0 200 140" class="dial" aria-hidden="true">
      <defs>
        <!-- bezel gradient -->
        <radialGradient id="gBezel" cx="50%" cy="60%">
          <stop offset="0%" stop-color="#151515" />
          <stop offset="70%" stop-color="#1a1a1a" />
          <stop offset="100%" stop-color="#0c0c0c" />
        </radialGradient>

        <!-- dial base -->
        <radialGradient id="gDial" cx="50%" cy="75%">
          <stop offset="0%" stop-color="#141414" />
          <stop offset="100%" stop-color="#0a0a0a" />
        </radialGradient>

        <!-- glowing red arc -->
        <linearGradient id="gArc" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#800000" />
          <stop offset="50%" stop-color="#c22" />
          <stop offset="100%" stop-color="#ff4545" />
        </linearGradient>

        <!-- needle shadow -->
        <filter id="fShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.7" />
        </filter>

        <!-- glass glare -->
        <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.15" />
          <stop offset="40%" stop-color="#fff" stop-opacity="0.03" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- bezel -->
      <circle cx="100" cy="120" r="92" fill="url(#gBezel)" />
      <circle cx="100" cy="120" r="86" fill="url(#gDial)" stroke="#1d1d1d" stroke-width="2" />

      <!-- progress arc -->
      <path id="arc" d="M20,120 A80,80 0 0,1 180,120" fill="none" stroke="url(#gArc)" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251" />

      <!-- tick marks -->
      <g stroke="#a9b1b1" stroke-width="1.6" opacity=".85">
        <line x1="20" y1="120" x2="30" y2="115" />
        <line x1="60" y1="60" x2="66" y2="68" />
        <line x1="100" y1="40" x2="100" y2="50" />
        <line x1="140" y1="60" x2="134" y2="68" />
        <line x1="180" y1="120" x2="170" y2="115" />
      </g>

      <!-- numbers -->
      <g font-family="Orbitron, system-ui, sans-serif" font-size="10" fill="#d9d9d9" text-anchor="middle">
        <text x="28" y="114">0</text>
        <text x="64" y="70">25</text>
        <text x="100" y="38">50</text>
        <text x="136" y="70">75</text>
        <text x="172" y="114">100</text>
      </g>

      <!-- needle -->
      <g id="needle" transform="rotate(-90 100 120)" filter="url(#fShadow)">
        <polygon points="100,120 98.3,120.8 100,50 101.7,120.8" fill="url(#gArc)" />
        <circle cx="100" cy="120" r="5.5" fill="#0b0b0b" stroke="#ff4545" stroke-width="2" />
      </g>

      <!-- label -->
      <text x="100" y="92" font-family="Orbitron, system-ui, sans-serif" font-size="8" fill="#a9b1b1"
        text-anchor="middle" opacity=".7">
        LOADING
      </text>

      <!-- glass highlight -->
      <path d="M14,88 C60,40 140,40 186,88" fill="url(#gGlass)" opacity=".8" />
    </svg>

    <div class="readout"><span id="spd">0</span>%</div>
  </div>




  <section class="lock-section" id="hero">

  </section>

  <div id="scroll-container">
    <p>Scroll To Continue</p>
  </div>

  <section id="section-container">
    <section class="sections lock-section" id="section-1">

    </section>

    <section class="sections" id="section-3">

    </section>

    <section class="sections lock-section" id="alock-section">
      <div id="section-1-container">
        <div class="reveals-wrapper">
          <h1 class="reveals">Blending <br> creativity <br> and <br> design.</h1>
        </div>
      </div>
    </section>

    <section class="sections lock-section" id="section-4">
      <div id="section-4-container">
        <h1 id="section-4-text">To craft meaningful user experiences</h1>
      </div>
    </section>

    <div id="blackout"></div>

    <div id="bridge-4-6"></div>

    <section class="sections lock-section" id="section-6">
      <h1 id="section-6-heading">This is Amro's Studio</h1>
    </section>

    <div id="bridge-6-7"></div>

    <section class="sections lock-section" id="projects-section">
      <div id="number-plate">######-GP</div>
      <div id="my-bouncecards" class="bounceCardsContainer"></div>
    </section>


    <script type="module">
      import { createBounceCards } from "./Javascript/bounceCards.js";
      const PUB = (p) => `${import.meta.env.BASE_URL}${p}`;

      const images = [
        PUB("images/FerrariBackground.png"),
        PUB("images/GroveeeeImage.png"),
        PUB("images/MlungisiLogo.png"),
      ];

      const labels = ["FERRARI-GP", "GROVEEEE-GP", "MLUNGISI-GP"];

      const links = [
        "https://amrochewschappies.github.io/Amro-s-Ecommerce-Website/",
        "https://amrochewschappies.github.io/Dragonfly-App/",
        "https://smash-botato.example"
      ];

      const transformStyles = [
        "rotate(5deg) translate(-150px)",
        "rotate(0deg) translate(-70px)",
        "rotate(-5deg)",
        "rotate(5deg) translate(70px)",
        "rotate(-5deg) translate(150px)",
      ];

      createBounceCards("#my-bouncecards", {
        images,
        labels,
        links,
        containerWidth: 500,
        containerHeight: 250,
        animationDelay: 1,
        animationStagger: 0.08,
        easeType: "elastic.out(1, 0.5)",
        transformStyles,
        enableHover: true,
        clickTarget: "_blank",
        useAnchors: false
      });
    </script>

    <!-- leave this as-is; Vite will rewrite it on build -->
    <script type="module" src="./Three.js/main.js"></script>

    <section>
      <p>created by Amro
      </p>
    </section>
  </section>
</body>

</html>
